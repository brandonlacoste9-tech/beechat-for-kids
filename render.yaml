# 🚀 BEEChat Render Deployment Configuration
# Neon PostgreSQL + Render = Perfect match!

services:
  # Backend API
  - type: web
    name: beechat-api
    runtime: node
    region: ohio
    plan: free
    branch: master
    rootDir: backend
    buildCommand: npm install
    startCommand: npx tsx index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false  # Set this in Render dashboard with your Neon URL
    healthCheckPath: /api/health

  # Frontend (static site)
  - type: static
    name: beechat-app
    runtime: static
    region: ohio
    plan: free
    branch: master
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://beechat-api.onrender.com  # Update with your API URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
